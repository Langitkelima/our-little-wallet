<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OUR LITTLE WALLET ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  color-scheme:light;--bg:#F5F0E4;--card:#FFFBF2;--ink:#26314A;--mut:#69748E;
  --accent:#5D86C2;--accent-strong:#3F6399;--accent-soft:#E4ECF7;--line:#E7DFCD;
  --in:#2B7C63;--out:#B5506A;--sh:0 10px 28px rgba(60,82,125,.09);--focus:rgba(93,134,194,.28);
  --btn:#4A71AB;--btn-ink:#fff;--on-accent:#fff;--ovl:rgba(38,49,74,.42);--navsh:0 -8px 24px rgba(60,82,125,.08);
  --page:radial-gradient(ellipse at 100% 0%,rgba(143,176,221,.30),transparent 42%),radial-gradient(ellipse at 0% 100%,rgba(240,226,190,.65),transparent 46%),linear-gradient(180deg,#F7F2E7 0%,#F2ECDD 100%);
  --hero:radial-gradient(circle at 94% 5%,rgba(255,255,255,.22),transparent 40%),linear-gradient(128deg,#3B5F96 0%,#5580BA 58%,#8FA9D8 125%);
  --pink:var(--accent);--pinkd:var(--accent-strong);--pinks:var(--accent-soft);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;--bg:#0A1020;--card:#121B30;--ink:#E7EDF9;--mut:#8F9DBA;
  --accent:#7FA6F0;--accent-strong:#9DBBFA;--accent-soft:#1A2947;--line:#22314F;
  --in:#6FD3B0;--out:#F08FA6;--sh:0 12px 32px rgba(2,6,16,.45);--focus:rgba(127,166,240,.30);
  --btn:#4A74CC;--btn-ink:#fff;--on-accent:#0A1020;--ovl:rgba(4,8,18,.66);--navsh:0 -8px 24px rgba(2,6,16,.4);
  --page:radial-gradient(ellipse at 100% 0%,rgba(74,116,204,.24),transparent 42%),radial-gradient(ellipse at 0% 100%,rgba(48,80,160,.16),transparent 46%),linear-gradient(180deg,#0A1020 0%,#0D1630 100%);
  --hero:radial-gradient(circle at 94% 5%,rgba(127,166,240,.34),transparent 40%),linear-gradient(128deg,#101F40 0%,#1B3770 58%,#3459A6 125%);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0A1020;--card:#121B30;--ink:#E7EDF9;--mut:#8F9DBA;
  --accent:#7FA6F0;--accent-strong:#9DBBFA;--accent-soft:#1A2947;--line:#22314F;
  --in:#6FD3B0;--out:#F08FA6;--sh:0 12px 32px rgba(2,6,16,.45);--focus:rgba(127,166,240,.30);
  --btn:#4A74CC;--btn-ink:#fff;--on-accent:#0A1020;--ovl:rgba(4,8,18,.66);--navsh:0 -8px 24px rgba(2,6,16,.4);
  --page:radial-gradient(ellipse at 100% 0%,rgba(74,116,204,.24),transparent 42%),radial-gradient(ellipse at 0% 100%,rgba(48,80,160,.16),transparent 46%),linear-gradient(180deg,#0A1020 0%,#0D1630 100%);
  --hero:radial-gradient(circle at 94% 5%,rgba(127,166,240,.34),transparent 40%),linear-gradient(128deg,#101F40 0%,#1B3770 58%,#3459A6 125%);
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;max-width:100%;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5}
html{scroll-behavior:smooth}
body{min-height:100vh;background:var(--page);transition:background-color .2s,color .2s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
button:focus-visible,[data-act]:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.app{width:100%;max-width:720px;margin:0 auto;padding:18px 16px calc(132px + env(safe-area-inset-bottom,0px))}
.app>header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 18px}
.brand-lockup{min-width:0}
h1{font:700 20px/1.2 Georgia,"Times New Roman",serif;letter-spacing:.015em;margin:0 0 5px}
.sub{color:var(--mut);font-size:13px}
#me{margin-top:5px}
.head-actions{display:flex;align-items:center;gap:8px;flex:none}
.ib{border:1px solid var(--line);background:var(--card);color:var(--ink);width:44px;height:44px;border-radius:15px;box-shadow:var(--sh);display:grid;place-items:center;cursor:pointer;transition:transform .18s,border-color .18s,background .18s}
.ib:hover{border-color:var(--accent);transform:translateY(-1px)}
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);padding:18px;margin:0 0 14px;transition:background-color .2s,border-color .2s}
.hero{position:relative;overflow:hidden;background:var(--hero);border-color:transparent;color:#fff}
.hero::after{content:"";position:absolute;width:180px;height:180px;border:1px solid rgba(255,255,255,.12);border-radius:50%;right:-82px;bottom:-116px;box-shadow:0 0 0 24px rgba(255,255,255,.035),0 0 0 48px rgba(255,255,255,.025);pointer-events:none}
.hero .big{font:700 clamp(27px,5vw,36px)/1.14 Georgia,"Times New Roman",serif;letter-spacing:-.025em;margin:7px 0 9px;overflow-wrap:anywhere}
.hero .sub{color:rgba(255,255,255,.74)}
.row{display:flex;gap:12px}
.row>*{flex:1;min-width:0}
.mini .lbl{color:var(--mut);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.mini .v{font-weight:750;font-size:clamp(16px,2.6vw,21px);margin-top:6px;overflow-wrap:anywhere;letter-spacing:-.025em}
.in{color:var(--in)}.out{color:var(--out)}
h2{font-size:16px;line-height:1.35;font-weight:750;letter-spacing:-.01em;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.link{background:none;border:0;color:var(--accent-strong);font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:6px 0}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.bar{margin:13px 0}
.bar .t{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;margin-bottom:6px}
.bar .t span:last-child{text-align:right;font-weight:650;white-space:nowrap}
.track{height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .35s ease}
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.tx:last-child{border:0}
.tx-edit{cursor:pointer}
.av{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;font-weight:750;color:#fff;flex:none}
.tx .m{flex:1;min-width:0}
.tx .d,.view-acc .tx .d{text-transform:uppercase;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tx .a{font-weight:750;font-size:13px;text-align:right;white-space:nowrap;letter-spacing:-.015em}
.del{background:transparent;border:0;color:var(--mut);padding:7px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:none}
.del:hover{background:var(--accent-soft);color:var(--accent-strong)}
.empty{text-align:center;padding:30px 12px;color:var(--mut);font-size:13px}
.empty b{display:block;color:var(--ink);font-size:16px;margin:8px 0 4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--mut);padding:8px 14px;border-radius:99px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:background .18s,border-color .18s,color .18s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}
.av[style*="--pink"]{color:var(--on-accent)}
.dayhd{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;font-weight:750;color:var(--mut);letter-spacing:.02em;padding:16px 0 4px}
.dayhd:first-of-type{padding-top:8px}
.fhint{margin-top:10px;display:flex;justify-content:flex-end}
input,select,textarea{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:46px;transition:border-color .18s,box-shadow .18s,background .18s}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.8}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px var(--focus)}
textarea{min-height:84px;resize:vertical}
label{display:block;font-weight:700;font-size:12.5px;margin:14px 0 6px}
.err{color:var(--out);font-size:12px;margin-top:5px;min-height:0}
.btn{width:100%;border:0;border-radius:15px;background:var(--btn);color:var(--btn-ink);font:inherit;font-size:14px;font-weight:750;padding:14px 16px;margin-top:16px;cursor:pointer;transition:transform .18s,filter .18s,box-shadow .18s}
.btn:hover{filter:brightness(1.04);transform:translateY(-1px);box-shadow:0 8px 18px rgba(40,70,130,.22)}
.btn:active{transform:translateY(0)}
.btn.sec{background:var(--accent-soft);color:var(--accent-strong);border:1px solid var(--line);box-shadow:none}
.btn.dng{background:#B5455F}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:13px;padding:12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:background .18s,border-color .18s,color .18s}
.seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}
#sync{display:flex;align-items:center;gap:9px;width:fit-content;max-width:100%;background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:9px 13px;margin:0 0 20px;font-size:11.5px;line-height:1.35;box-shadow:none;cursor:pointer;overflow-wrap:anywhere}
#sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--in);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--in) 13%,transparent)}
#view{min-width:0}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 93%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:6px 7px calc(7px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:var(--navsh)}
nav button{min-width:0;background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;font-size:10px;font-weight:700;padding:6px 2px;border-radius:12px;cursor:pointer;min-height:52px;white-space:nowrap}
nav button svg{flex:none}
nav button.on{color:var(--accent-strong);background:var(--accent-soft)}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;border:0;background:var(--btn);color:var(--btn-ink);box-shadow:0 10px 24px rgba(40,70,130,.35);display:grid;place-items:center;z-index:35;cursor:pointer;transition:transform .18s,box-shadow .18s}
.fab:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(40,70,130,.45)}
.ov{position:fixed;inset:0;background:var(--ovl);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:620px;max-height:min(92vh,860px);max-height:min(92dvh,860px);overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 50px rgba(0,0,0,.12)}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.sheet h3{margin:0;font:700 21px/1.25 Georgia,"Times New Roman",serif;letter-spacing:-.015em}
.dlg{align-items:center;padding:20px}
.dlg .sheet{border-radius:24px;border-bottom:1px solid var(--line);max-height:min(88vh,860px);max-height:min(88dvh,860px)}
.note{background:var(--accent-soft);color:var(--ink);border:1px solid var(--line);border-radius:15px;padding:11px 14px;font-size:12px;margin-bottom:14px}
/* Perbaikan: tarik-ke-bawah di menu/panel tidak lagi me-refresh halaman (pull-to-refresh Chrome) */
/* scroll WebView: jangan pakai overflow-x:hidden / overscroll none di html+body */
body{overflow-x:clip}
.ov{overscroll-behavior:contain}
.ov .sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
</style>
<style data-m="1">
.avlogo{background:none!important;padding:0;overflow:hidden}
.avlogo svg,.avlogo img{width:100%;height:100%}
.mlogo{display:inline-block;vertical-align:-5px;margin-right:5px;border-radius:6px;overflow:hidden}
.bprev{display:flex;align-items:center;gap:10px;min-height:36px;margin:8px 0 2px;color:var(--mut);font-size:12.5px}
.bpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 4px}
.bpick button{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:14px;padding:8px 2px 6px;font:inherit;font-size:10px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.bpick button:hover,.bpick button:focus-visible{border-color:var(--accent);outline:none}
.bpick button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
<style>
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;background:var(--accent-soft);color:var(--accent-strong);border-radius:99px;padding:4px 9px;font-weight:750;vertical-align:middle;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(145px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:99px;font-size:12.5px;font-weight:650;z-index:70;max-width:90%;box-shadow:var(--sh)}
.cols{display:flex;align-items:flex-end;gap:10px;height:140px;margin-top:12px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut);gap:7px}
.pair{display:flex;align-items:flex-end;gap:4px;flex:1;width:100%}
.pair i{flex:1;border-radius:7px 7px 2px 2px;min-height:3px}
.cd{font:700 23px/1 Georgia,"Times New Roman",serif;color:var(--accent-strong);text-align:center;min-width:64px;line-height:1.1}
.cd small{display:block;font:700 10px/1.3 ui-sans-serif,system-ui;color:var(--mut);margin-top:5px}
.hide{display:none!important}

/* ===== Layar masuk (PIN angka) ===== */
.gate{text-align:left}
.gate-logo{width:48px;height:48px;border-radius:16px;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;margin-bottom:12px}
.gate-eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.2em;color:var(--mut);margin-bottom:6px}
.gate h3{margin-bottom:8px}
.gate p.sub{margin:0 0 6px;font-size:12.5px}
.pin-dots{display:flex;justify-content:center;gap:16px;margin:16px 0 18px;min-height:16px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);transition:background .12s,transform .12s}
.pin-dot.on{background:var(--accent);transform:scale(1.08)}
.keys{display:grid;grid-template-columns:repeat(3,64px);justify-content:center;gap:10px 16px}
.key{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 24px/1 ui-sans-serif,system-ui,sans-serif;display:grid;place-items:center;cursor:pointer;padding:0;transition:background .12s,border-color .12s,transform .08s}
.key:active{background:var(--accent-soft);border-color:var(--accent);transform:scale(.94)}
.key.ghost{border-color:transparent;background:transparent;color:var(--mut)}
.keys .sp{visibility:hidden}
.gate-sw{display:block;margin:12px auto 0;text-align:center;text-decoration:underline;text-underline-offset:3px}
.gate .err{text-align:center;min-height:16px}
@media (max-height:700px){.key{width:54px;height:54px;font-size:21px}.keys{grid-template-columns:repeat(3,54px);gap:8px 14px}.gate-logo{display:none}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media (max-width:390px){
  .app{padding-left:12px;padding-right:12px}
  .app>header{gap:8px}
  h1{font-size:18px}
  .sub{font-size:12px}
  .head-actions{gap:6px}
  .ib{width:40px;height:40px;border-radius:13px}
  .card{padding:15px;border-radius:19px}
  .row{gap:8px}
  .mini .v{font-size:15px}
  .tx{gap:9px}
  .av{width:38px;height:38px;border-radius:13px}
  .tx .a{font-size:12px}
  nav button{font-size:9.5px}
}
@media (min-width:720px){
  .app{max-width:900px;padding:26px 26px 150px}
  .app>header{margin-bottom:22px}
  .view-home{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);grid-template-areas:"hero summary" "savings categories" "latest latest";gap:16px;align-items:stretch}
  .view-home:not(:has(.savings-overview)){grid-template-areas:"hero summary" "categories categories" "latest latest"}
  .view-home>.hero{grid-area:hero;display:flex;flex-direction:column;justify-content:center;min-height:184px;margin:0}
  .view-home>.summary-row{grid-area:summary;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0}
  .view-home>.summary-row>.card{display:flex;flex-direction:column;justify-content:center;margin:0;padding:16px}
  .view-home>.savings-overview{grid-area:savings;margin:0}
  .view-home>.category-overview{grid-area:categories;margin:0}
  .view-home>.latest-overview{grid-area:latest;margin:0}
  .view-trx{display:grid;grid-template-columns:minmax(245px,.75fr) minmax(0,1.5fr);gap:16px;align-items:start}
  .view-trx>.card{margin:0}
  .view-trx>.card:first-child .row{display:grid;grid-template-columns:1fr;gap:9px}
  .view-acc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
  .view-acc>.hero{grid-column:1/-1;margin:0}
  .view-acc>.card{margin:0!important}
  .view-acc>.btn{margin-top:0}
  .view-acc>p.sub{grid-column:1/-1}
  .view-sav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
  .view-sav>h2,.view-sav>p.sub,.view-sav>.link,.view-sav>.btn{grid-column:1/-1}
  .view-sav>.card{margin:0}
  .view-dates{max-width:980px;margin-inline:auto}
  .view-rep{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  .view-rep>.card,.view-rep>p{margin:0}
  .view-rep>p{grid-column:1/-1}
}
@media (min-width:980px){
  body::before{display:none}
  .app{width:calc(100% - 260px);max-width:1500px;margin:0 auto 0 260px;padding:30px clamp(26px,3.4vw,56px) 54px}
  .app>header{margin-bottom:24px}
  h1{font-size:22px}
  .sub{font-size:13px}
  #sync{margin-bottom:24px}
  nav{left:0;right:auto;top:0;bottom:0;width:260px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:7px;padding:28px 16px 20px;border-top:0;border-right:1px solid var(--line);box-shadow:none;overflow-y:auto;background:var(--card)}
  nav::before{content:"MENU UTAMA";display:block;color:var(--mut);font-size:10px;font-weight:800;letter-spacing:.14em;padding:4px 14px 18px;margin-bottom:9px;border-bottom:1px solid var(--line)}
  nav::after{content:"RAMA & DESY\A Personal finance, together";white-space:pre-line;display:block;margin-top:auto;padding:18px 14px 0;border-top:1px solid var(--line);color:var(--mut);font-size:11px;line-height:1.8}
  nav button{width:100%;display:flex;flex-direction:row;justify-content:flex-start;align-items:center;gap:13px;padding:12px 14px;min-height:48px;border-radius:13px;font-size:13px;white-space:normal;text-align:left}
  nav button.on{background:var(--accent-soft);color:var(--accent-strong);box-shadow:inset 3px 0 0 var(--accent)}
  nav button:hover:not(.on){background:var(--bg);color:var(--ink)}
  .fab{right:32px;bottom:30px;width:58px;height:58px;border-radius:19px}
  .toast{bottom:28px}
  .view-home{grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:18px}
  .view-home>.summary-row{gap:14px}
  .view-home>.summary-row>.card{padding:20px}

Object.keys(LOGO_IMG).forEach(k=>{if(BRANDS[k])BRANDS[k].img=LOGO_IMG[k]});
const brandOf=name=>{const u=String(name||'').toUpperCase();const r=BRAND_RULES.find(x=>x[1].test(u));return r?BRANDS[r[0]]:null};
function logo(name,size=40,cls=''){const b=typeof name==='object'?name:brandOf(name);if(!b)return'';
  if(b.img)return `<img class="${cls}" src="${b.img}" width="${size}" height="${size}" alt="${esc(b.n)}" style="border-radius:28%;flex:none;object-fit:cover;display:block">`;
  const H=b.strip?33:48,L=b.t,mx=Math.max(...L.map(s=>s.length));
  const fs=Math.min(L.length>1?15:20,40/(.6*mx),(H-8)/L.length);
  const ty=L.length>1?H/2-fs*.1:H/2+fs*.34;
  const txt=L.map((s,i)=>`<text x="24" y="${(L.length>1?(H/2-(L.length-1)*fs*.55+i*fs*1.1+fs*.34):ty).toFixed(1)}" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="${fs.toFixed(1)}" fill="${b.fg}">${esc(s)}</text>`).join('');
  const st=b.strip?`<rect y="33" width="48" height="15" fill="${b.strip.bg}"/><text x="24" y="43.6" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="10" fill="${b.strip.fg}">${esc(b.strip.t)}</text>`:'';
  return `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 48 48" role="img" aria-label="${esc(b.n)}" style="border-radius:28%;flex:none"><rect width="48" height="${H}" fill="${b.bg}"/>${txt}${st}</svg>`}
const miniLogo=name=>{const b=brandOf(name);return b?`<span class="mlogo">${logo(b,20)}</span>`:''};
const accAv=name=>{const b=brandOf(name);if(b)return`<div class="av avlogo">${logo(b,42)}</div>`;
  const cash=/TUNAI|CASH/i.test(name||'');return`<div class="av" style="background:var(--pink)">${ic(cash?'cash':'wallet',20)}</div>`};

function syncThemeButton(){const b=$('#themeToggle');if(!b)return;const t=currentTheme();b.innerHTML=ic(t==='dark'?'sun':'moon',21);b.setAttribute('aria-label',t==='dark'?'Ganti ke tema terang':'Ganti ke tema gelap');b.title=t==='dark'?'Ganti ke tema terang':'Ganti ke tema gelap'}

let loaded=false,pend=0,ME='';
function call(payload){return new Promise((res,rej)=>{const p=JSON.stringify({...payload,key:CFG.key});
  const done=t=>{try{const r=JSON.parse(t);r.ok?res(r):rej(new Error(r.error||'Gagal'))}catch(e){rej(new Error('Respons tidak valid'))}};
  if(inScript)google.script.run.withSuccessHandler(done).withFailureHandler(e=>rej(new Error(e.message||'Gagal terhubung'))).api(p);
  else fetch(CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:p}).then(r=>r.text()).then(done,()=>rej(new Error('Tidak bisa terhubung ke server')))})}
function setSync(s,m){const el=$('#sync');if(el)el.textContent={load:'Memuat dari Google Sheet…',saving:'Menyimpan ke Google Sheet…',ok:'Terhubung ke Google Sheet',err:'Gagal: '+(m||'')+' · ketuk untuk muat ulang'}[s]}
async function save(table,row){pend++;setSync('saving');try{await call({action:'upsert',table,row});pend--;if(!pend)setSync('ok')}catch(e){pend--;setSync('err',e.message);toast('Gagal menyimpan: '+e.message);resync(e.message)}}
async function drop(table,id){pend++;setSync('saving');try{await call({action:'remove',table,id});pend--;if(!pend)setSync('ok')}catch(e){pend--;setSync('err',e.message);toast('Gagal menghapus: '+e.message);resync(e.message)}}
async function resync(m){if(/passcode/i.test(m)){LS.del('olw_key');CFG.key='';loaded=false;gate(m);return}
  if(pend)return;const r=await load();if(r===true)setSync('err',m)}
function logout(){LS.del('olw_key');CFG.key='';ME='';loaded=false;S.accounts=[];S.categories=[];S.transactions=[];S.goals=[];S.dates=[];tab='home';closeSheet();render();gate()}
function savGroups(){const sh=S.goals.filter(g=>g.scope!=='private'),pv=S.goals.filter(g=>g.scope==='private');
  return (sh.length?`<h2 style="margin:6px 4px 10px">Tabungan bersama</h2><p class="sub" style="margin:-4px 4px 10px">RAMA dan DESY bisa melihat ini.</p>`+sh.map(goalCard).join(''):'')+(pv.length?`<h2 style="margin:6px 4px 10px">Tabungan pribadi ${ME} ${ic('lock',14)}</h2><p class="sub" style="margin:-4px 4px 10px">Hanya kamu yang bisa melihat ini.</p>`+pv.map(goalCard).join(''):'')}
function saveNew(table,arr,row){arr.push(row);save(table,row)}
function saveObj(table,row){save(table,row);return row}

function hydrate(d){S.accounts=d.Accounts;S.categories=d.Categories;S.transactions=d.Transactions;
  S.goals=d.Goals.map(g=>({...g,deps:d.Deposits.filter(x=>x.goal===g.id).map(x=>({id:x.id,date:x.date,by:x.by,amount:x.amount,note:x.note}))}));
  S.dates=d.Dates.map(x=>({...x,yearly:x.yearly===true||x.yearly==='TRUE'}));loaded=true}

let gateKb=false,gateRem=true;
function gate(msg){
  ov.className='ov dlg';
  const needUrl=!(inScript||DEFAULT_URL);
  let pin='',busy=false;
  const pinPart=`<div class="pin-dots" id="pd" aria-label="Passcode"></div><div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" class="key" data-k="${n}" aria-label="${n}">${n}</button>`).join('')}<span class="sp"></span><button type="button" class="key" data-k="0" aria-label="0">0</button><button type="button" class="key ghost" data-k="bs" aria-label="Hapus satu angka">${ic('back',24)}</button></div>`;
  const kbPart=`<label for="g-k">Passcode</label><input id="g-k" type="password" autocomplete="current-password">`;
  ov.innerHTML=`<div class="sheet gate"><div class="gate-top"><button type="button" class="gate-logo" data-act="themeToggle" aria-label="Ganti tema" title="Ganti tema (terang/gelap)">${ic('heart',22)}</button><img class="gate-brand" src="${(document.querySelector('.brand-logo img')||{}).src||''}" alt="Two Pockets"></div><div class="gate-eyebrow">RUANG PRIBADI KITA</div><h3>Masuk ♡</h3><p class="sub">Masukkan passcode pribadi kamu. RAMA dan DESY punya passcode berbeda, dan data pribadi masing-masing tidak terlihat oleh yang lain di aplikasi.</p>${needUrl?`<label for="g-u">URL Web App</label><input id="g-u" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(CFG.url)}">`:''}${gateKb?kbPart:pinPart}<label style="font-weight:400"><input type="checkbox" id="g-r" ${gateRem?'checked':''} style="width:auto;min-height:0;margin-right:8px">Ingat di perangkat ini</label><div class="err" id="e-gk">${esc(msg||'')}</div><button class="btn" id="g-go">Masuk</button><button type="button" class="link gate-sw" id="g-sw">${gateKb?'Pakai keypad angka':'Passcode bukan angka? Pakai keyboard'}</button></div>`;
  const drawDots=()=>{const el=$('#pd');if(!el)return;const n=Math.max(4,pin.length);let h='';for(let i=0;i<n;i++)h+=`<span class="pin-dot${i<pin.length?' on':''}"></span>`;el.innerHTML=h};
  if(!gateKb)drawDots();
  ov.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(busy)return;const k=b.dataset.k;if(k==='bs')pin=pin.slice(0,-1);else if(pin.length<32)pin+=k;setErr('gk','');drawDots()});
  $('#g-r').onchange=e=>{gateRem=e.target.checked};
  $('#g-sw').onclick=()=>{gateKb=!gateKb;gate();if(gateKb){const i=$('#g-k');if(i)i.focus()}};
  const go=async()=>{if(busy)return;const key=gateKb?$('#g-k').value:pin;
    if($('#g-u'))CFG.url=$('#g-u').value.trim();
    if(!key){setErr('gk','Passcode wajib diisi');return}
    CFG.key=key;busy=true;setErr('gk','Memeriksa…');
    const r=await load();busy=false;
    if(r===true){if(gateRem){LS.set('olw_key',CFG.key);if(CFG.url)LS.set('olw_url',CFG.url)}closeSheet()}
    else{setErr('gk',r);if(!gateKb){pin='';drawDots()}else{const i=$('#g-k');if(i){i.value='';i.focus()}}}};
  $('#g-go').onclick=go;
  if(gateKb)$('#g-k').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
}

  const sh=S.goals.filter(g=>g.scope!=='private'),pv=S.goals.filter(g=>g.scope==='private');
  return `<div class="card savings-overview" data-act="tab" data-t="sav" style="cursor:pointer"><h2>Tabungan <span class="badge">Lihat</span></h2>${sh.length?`<div class="sub">Bersama · terlihat RAMA &amp; DESY</div>`+sh.map(row).join(''):''}${pv.length?`<div class="sub" style="margin-top:12px">${ic('lock',12)} Pribadi ${ME} · hanya kamu yang bisa lihat</div>`+pv.map(row).join(''):''}</div>`}
function goalCard(g){const got=gSum(g),pct=g.target?Math.min(100,got/g.target*100):0,left=Math.max(0,g.target-got);let hint='';
 if(left===0)hint='Target tercapai ♡';
 else if(g.deadline){const [y,m]=g.deadline.split('-').map(Number),mo=(y-NOW.getFullYear())*12+(m-1-NOW.getMonth());hint=mo>0?`Menuju ${fdate(g.deadline)} · butuh sekitar ${rp(left/mo)} per bulan`:`Tanggal target ${fdate(g.deadline)} sudah dekat atau lewat`}
 const recent=[...g.deps].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
 return `<div class="card"><h2><span>${esc(g.name)} <span class="badge">${g.scope==='private'?ic('lock',12)+' Pribadi':'Bersama'}</span></span> <button class="del" data-act="editGoal" data-id="${g.id}" aria-label="Ubah target">${ic('edit',18)}</button></h2><div style="font:700 24px/1.2 Georgia,serif">${rp(got)}</div><div class="sub">dari ${rp(g.target)} · ${Math.round(pct)}%</div><div class="track" style="margin:10px 0"><div class="fill" style="width:${pct}%;background:var(--pink)"></div></div>${g.scope==='private'?'':`<div class="row"><div class="mini"><div class="lbl">Dari ${PEOPLE[0]}</div><div class="v">${rp(gBy(g,PEOPLE[0]))}</div></div><div class="mini"><div class="lbl">Dari ${PEOPLE[1]}</div><div class="v">${rp(gBy(g,PEOPLE[1]))}</div></div></div>`}${hint?`<div class="note" style="margin:12px 0 0">${hint}</div>`:''}<button class="btn" data-act="addDep" data-id="${g.id}">+ Setor tabungan</button><div style="margin-top:10px">${recent.length?recent.map(d=>`<div class="tx"><div class="av" style="background:var(--pink)">${d.by[0]}</div><div class="m"><div class="d">Setoran ${d.by}${d.note?' · '+esc(d.note):''}</div><div class="s">${fdate(d.date)}</div></div><div class="a in">+${rp(d.amount)}</div>${d.by===ME?`<button class="del" data-act="delDep" data-id="${g.id}" data-d="${d.id}" aria-label="Hapus setoran">${ic('trash',18)}</button>`:''}</div>`).join(''):'<div class="empty">Belum ada setoran. Satu langkah kecil dulu ♡</div>'}</div></div>`}
function listTx(){let l=S.transactions.filter(t=>(F.type==='all'||t.type===F.type)&&(!F.cat||t.cat===F.cat)&&(!F.acc||t.acc===F.acc)&&(!F.month||t.date.startsWith(F.month))&&(!F.day||+t.date.slice(8,10)===+F.day)&&(!F.q||t.desc.toLowerCase().includes(F.q.toLowerCase())));
  if(!l.length){$('#trxList').innerHTML=emptyTx(S.transactions.length?'Tidak ada yang cocok':'');return}
  const dOut={};l.forEach(t=>{if(t.type==='out')dOut[t.date]=(dOut[t.date]||0)+t.amount});
  let last='',h='';sorted(l).forEach(t=>{if(t.date!==last){last=t.date;h+=`<div class="dayhd"><span>${fday(t.date)}</span>${dOut[t.date]?`<span class="out">−${rp(dOut[t.date])}</span>`:''}</div>`}h+=txRow(t)});
  const ti=sum(l,'in'),to=sum(l,'out');
  $('#trxList').innerHTML=`<div class="sub" style="margin-bottom:2px">${l.length} transaksi${ti?` · Masuk <span class="in">+${rp(ti)}</span>`:''}${to?` · Keluar <span class="out">−${rp(to)}</span>`:''}</div><div class="sub" style="margin-bottom:2px;font-size:11.5px">Ketuk transaksi untuk mengubahnya.</div>`+h}
function render(){const me=$('#me');if(me)me.textContent=ME?'Masuk sebagai '+ME:'';$('#view').className='view view-'+tab;$('#view').innerHTML=loaded?VIEWS[tab]():'<div class="empty"><b>Memuat data…</b></div>';if(loaded&&tab==='trx')listTx();
  $('#nav').innerHTML=TABS.map(t=>`<button class="${(tab===t[0]||(tab==='sav'&&t[0]==='acc'))?'on':''}" data-act="tab" data-t="${t[0]}">${ic(t[2],22)}${t[1]}</button>`).join('');
  $('#fab').style.display=(tab==='home'||tab==='trx')?'grid':'none';}

// ===== Sheets & dialogs =====
const ov=$('#ov');
function sheet(title,body,cls=''){ov.className='ov '+cls;ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="hd"><h3>${title}</h3><button class="ib" data-act="close" aria-label="Tutup" style="box-shadow:none">${ic('x',20)}</button></div>${body}</div>`}
const closeSheet=()=>{ov.className='ov hide';ov.innerHTML=''};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function confirmBox(msg,ok){sheet('Yakin?',`<p>${msg}</p><button class="btn dng" id="yes">Ya, hapus</button><button class="btn sec" data-act="close">Batal</button>`,'dlg');$('#yes').onclick=()=>{closeSheet();ok()}}
const setErr=(id,m)=>{const el=$('#e-'+id);if(el)el.textContent=m||''};
const catOpts=(type,sel)=>S.categories.filter(c=>c.kind===type||c.kind==='both').map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('');

// Tambah transaksi baru, atau ubah transaksi yang sudah ada (kalau id diisi)
function txSheet(id){
  if(!S.accounts.length){toast('Tambahkan akun dulu di tab Accounts');return}
  const old=id?S.transactions.find(x=>x.id===id):null;
  if(id&&!old)return;
  const t0=old||{type:'out',date:isoL(NOW),cat:'',desc:'',amount:0,acc:'',note:''};
  let type=t0.type==='in'?'in':'out';
  sheet(old?'Ubah transaksi':'Tambah transaksi',`<label>Jenis</label><div class="seg"><button data-act="ttype" data-v="in" class="${type==='in'?'on':''}">Pemasukan</button><button data-act="ttype" data-v="out" class="${type==='out'?'on':''}">Pengeluaran</button></div>
  <label for="f-date">Tanggal</label><input type="date" id="f-date" value="${esc(t0.date)}"><div class="err" id="e-date"></div>
  <label for="f-cat">Kategori</label><select id="f-cat">${catOpts(type,t0.cat)}</select>
  <label for="f-desc">Keterangan</label><input id="f-desc" maxlength="60" autocapitalize="characters" style="text-transform:uppercase" placeholder="mis. Makan siang" value="${esc(t0.desc)}"><div class="err" id="e-desc"></div>
  <label for="f-amt">Nominal (Rp)</label><input id="f-amt" inputmode="numeric" placeholder="0" autocomplete="off" value="${t0.amount?Number(t0.amount).toLocaleString('id-ID'):''}"><div class="err" id="e-amt"></div>
  <label for="f-acc">Akun</label><select id="f-acc">${S.accounts.map(a=>`<option value="${a.id}" ${a.id===t0.acc?'selected':''}>${esc(a.name)}</option>`).join('')}</select>
  <label for="f-note">Catatan (opsional)</label><textarea id="f-note" maxlength="200" autocapitalize="characters" style="text-transform:uppercase">${esc(t0.note||'')}</textarea>
  <button class="btn" id="save">${old?'Simpan perubahan':'Simpan transaksi'}</button>`);
  ov.onclick2=v=>{const cur=$('#f-cat').value;type=v;ov.querySelectorAll('[data-act=ttype]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#f-cat').innerHTML=catOpts(v,cur)};
  $('#f-amt').oninput=e=>{const d=e.target.value.replace(/\D/g,'').replace(/^0+/,'');e.target.value=d?(+d).toLocaleString('id-ID'):''};
  $('#save').onclick=()=>{const date=$('#f-date').value,desc=$('#f-desc').value.trim().toUpperCase(),amt=parseInt($('#f-amt').value.replace(/\D/g,''),10);
    setErr('date',date?'':'Tanggal wajib diisi');setErr('desc',desc?'':'Keterangan wajib diisi');
    setErr('amt',!amt?'Masukkan nominal lebih dari 0':amt>999999999999?'Nominal terlalu besar':'');
    if(!date||!desc||!amt||amt>999999999999)return;
    const o={date,type,cat:$('#f-cat').value,desc,amount:amt,acc:$('#f-acc').value,note:$('#f-note').value.trim().toUpperCase()};
    if(old)saveObj('Transactions',Object.assign(old,o));
    else saveNew('Transactions',S.transactions,{id:uid(),date:o.date,type:o.type,cat:o.cat,desc:o.desc,amount:o.amount,acc:o.acc,by:ME,note:o.note});
    closeSheet();render();toast(old?'Transaksi diperbarui':'Transaksi ditambahkan')}}

function accPick(){return MODEL==='2'?`<div class="bprev" id="a-prev"></div><label>Pilih cepat bank / e-wallet</label><div class="bpick">${BRANDS2.map(b=>`<button type="button" class="bchip" data-brand="${b.id}"><span class="bl">${logoSvg(b,36)}</span><span>${b.short}</span></button>`).join('')}</div>`:`
  <div class="bprev" id="a-prev"></div>
  <label>Pilih cepat (logo ikut otomatis)</label>
  <div class="bpick">${Object.keys(BRANDS).filter(k=>k!=='superbank').map(k=>`<button type="button" data-brand="${k}" aria-label="${esc(BRANDS[k].n)}">${logo(BRANDS[k],30)}<span>${esc(BRANDS[k].n.replace(' TABUNGAN BY JAGO',' TAB.').replace(' NABUNG BY SUPERBANK',' NAB.').replace('TUNAI / CASH','TUNAI'))}</span></button>`).join('')}</div>
`}
function accSheet(id){const a=S.accounts.find(x=>x.id===id)||{name:'',owner:'DESY',opening:0};
  sheet(id?'Ubah akun':'Tambah akun',`<label for="a-name">Nama akun</label><input id="a-name" maxlength="30" autocapitalize="characters" style="text-transform:uppercase" value="${esc(a.name)}" placeholder="mis. BCA Utama"><div class="err" id="e-an"></div>
  ${accPick()}
  
  <label for="a-op">Saldo awal (Rp)</label><input id="a-op" inputmode="numeric" value="${a.opening?a.opening.toLocaleString('id-ID'):''}" placeholder="0">
  <button class="btn" id="a-save">Simpan</button>${id?'<button class="btn sec" id="a-del">Hapus akun</button>':''}`);
  if(MODEL==='2'){
  const _pv=()=>{const b=brandOf2($('#a-name').value);$('#a-prev').innerHTML=b?`<span class="bl">${logoSvg(b,36)}</span><span>Logo: <b>${esc(b.short)}</b></span>`:'<span>Belum ada logo untuk nama ini</span>';document.querySelectorAll('.bchip').forEach(c=>c.classList.toggle('on',!!b&&c.dataset.brand===b.id))};
  $('#a-name').addEventListener('input',_pv);document.querySelectorAll('.bchip').forEach(c=>c.onclick=()=>{$('#a-name').value=BRANDS2.find(b=>b.id===c.dataset.brand).label;_pv()});_pv();
  }else{
  const prevLogo=()=>{const v=$('#a-name').value,b=brandOf(v);$('#a-prev').innerHTML=b?logo(b,30)+'<span>Logo: '+esc(b.n)+'</span>':'<span>Logo muncul otomatis kalau nama akun mengandung nama bank/e-wallet</span>'};
  $('#a-name').oninput=prevLogo;prevLogo();
  document.querySelectorAll('.bpick button').forEach(btn=>btn.onclick=()=>{$('#a-name').value=BRANDS[btn.dataset.brand].n;prevLogo()});
  }
  $('#a-op').oninput=e=>{const d=e.target.value.replace(/\D/g,'').replace(/^0+/,'');e.target.value=d?(+d).toLocaleString('id-ID'):''};
  $('#a-save').onclick=()=>{const name=$('#a-name').value.trim().toUpperCase();if(!name){setErr('an','Nama akun wajib diisi');return}
    const o={name,owner:ME,opening:parseInt($('#a-op').value.replace(/\D/g,''),10)||0};
    if(id)saveObj('Accounts',Object.assign(S.accounts.find(x=>x.id===id),o));else saveNew('Accounts',S.accounts,{id:uid(),...o});closeSheet();render();toast('Akun disimpan')};
  if(id)$('#a-del').onclick=()=>{if(S.transactions.some(t=>t.acc===id)){toast('Akun masih dipakai transaksi, tidak bisa dihapus');return}
    confirmBox(`Hapus akun ${esc(a.name)}?`,()=>{S.accounts=S.accounts.filter(x=>x.id!==id);drop('Accounts',id);render()})}}

function setSheet(){sheet('Pengaturan',`<p class="sub">Kelola kategori. Akun diatur di tab Accounts.</p>
  <div id="catl">${S.categories.map(c=>`<div class="tx"><div class="av catav">${catIc(c,38)}</div><div class="m"><div class="d">${esc(c.name)}</div><div class="s">${{in:'Pemasukan',out:'Pengeluaran',both:'Keduanya'}[c.kind]}</div></div><button class="del" data-act="delCat" data-id="${c.id}" aria-label="Hapus">${ic('trash',18)}</button></div>`).join('')}</div>
  <label for="c-name">Kategori baru</label><input id="c-name" maxlength="24"><div class="err" id="e-cn"></div>
  <label for="c-kind">Jenis</label><select id="c-kind"><option value="out">Pengeluaran</option><option value="in">Pemasukan</option><option value="both">Keduanya</option></select>
  <label>Ikon</label><input type="hidden" id="c-ic" value="tag"><div class="icopick" id="icopick">${ICON_CHOICES.map((i,n)=>`<button type="button" class="icopt${n?'':' on'}" data-ic="${i[0]}" aria-label="${i[1]}" title="${i[1]}">${catIc({icon:i[0]},44)}</button>`).join('')}</div>
  <button class="btn" id="c-add">Tambah kategori</button>
  <label>Tema</label><div class="seg"><button class="${currentTheme()==='light'?'on':''}" data-act="theme" data-v="light">Terang</button><button class="${currentTheme()==='dark'?'on':''}" data-act="theme" data-v="dark">Gelap</button></div>
  <label>Model</label><div class="seg"><button class="${MODEL==='1'?'on':''}" data-act="model" data-v="1">Model 1</button><button class="${MODEL==='2'?'on':''}" data-act="model" data-v="2">Model 2</button></div><button class="btn sec" data-act="logout" style="margin-top:20px">Keluar (${ME})</button>`);
  $('#icopick').onclick=e=>{const b=e.target.closest('.icopt');if(!b)return;$('#c-ic').value=b.dataset.ic;document.querySelectorAll('#icopick .icopt').forEach(x=>x.classList.toggle('on',x===b))};
  $('#c-add').onclick=()=>{const n=$('#c-name').value.trim();if(!n){setErr('cn','Nama wajib diisi');return}
    if(S.categories.some(c=>c.name.toLowerCase()===n.toLowerCase())){setErr('cn','Kategori sudah ada');return}
    saveNew('Categories',S.categories,{id:uid(),name:n,kind:$('#c-kind').value,icon:$('#c-ic').value,color:COLORS[S.categories.length%COLORS.length]});setSheet();render()}}

function dateSheet(){sheet('Tambah tanggal spesial',`<label for="x-t">Judul</label><input id="x-t" maxlength="40"><div class="err" id="e-xt"></div>
  <label for="x-d">Tanggal</label><input type="date" id="x-d"><div class="err" id="e-xd"></div>
  <label><input type="checkbox" id="x-y" style="width:auto;min-height:0;margin-right:8px">Berulang tiap tahun</label>
  <label for="x-n">Catatan (opsional)</label><input id="x-n" maxlength="60"><button class="btn" id="x-s">Simpan</button>`);
  $('#x-s').onclick=()=>{const t=$('#x-t').value.trim(),d=$('#x-d').value;setErr('xt',t?'':'Judul wajib diisi');setErr('xd',d?'':'Tanggal wajib diisi');if(!t||!d)return;
    saveNew('Dates',S.dates,{id:uid(),title:t,date:d,yearly:$('#x-y').checked,note:$('#x-n').value.trim()});closeSheet();render()}}

function depSheet(gid){const g=S.goals.find(x=>x.id===gid);
 sheet('Setor tabungan',`<p class="sub">${esc(g.name)}</p><label for="s-date">Tanggal</label><input type="date" id="s-date" value="${isoL(NOW)}"><div class="err" id="e-sd"></div><label for="s-amt">Nominal (Rp)</label><input id="s-amt" inputmode="numeric" placeholder="0" autocomplete="off"><div class="err" id="e-sa"></div><label for="s-note">Catatan (opsional)</label><input id="s-note" maxlength="60"><button class="btn" id="s-save">Simpan setoran</button>`);
 $('#s-amt').oninput=fmtIn;
 $('#s-save').onclick=()=>{const d=$('#s-date').value,a=parseInt($('#s-amt').value.replace(/\D/g,''),10);setErr('sd',d?'':'Tanggal wajib diisi');setErr('sa',!(a>0)?'Masukkan nominal lebih dari 0':a>999999999999?'Nominal terlalu besar':'');if(!d||!(a>0)||a>999999999999)return;
  {const dp={id:uid(),date:d,by:ME,amount:a,note:$('#s-note').value.trim()};g.deps.push(dp);save('Deposits',{...dp,goal:g.id})}closeSheet();render();toast('Setoran ditambahkan')}}
function goalSheet(id){const g=S.goals.find(x=>x.id===id)||{name:'',target:0,deadline:''};
 sheet(id?'Ubah target':'Target tabungan baru',`<label for="g-n">Nama target</label><input id="g-n" maxlength="40" autocapitalize="characters" style="text-transform:uppercase" value="${esc(g.name)}" placeholder="mis. Tabungan Nikah"><div class="err" id="e-gn"></div><label for="g-t">Target dana (Rp)</label><input id="g-t" inputmode="numeric" value="${g.target?g.target.toLocaleString('id-ID'):''}" placeholder="0"><div class="err" id="e-gt"></div>${id?'':'<label for="g-s2">Jenis tabungan</label><select id="g-s2"><option value="shared">Bersama (RAMA dan DESY bisa lihat)</option><option value="private">Pribadi (hanya aku)</option></select>'}<label for="g-d">Target tanggal (opsional)</label><input type="date" id="g-d" value="${g.deadline}"><button class="btn" id="g-s">Simpan</button>${id?'<button class="btn sec" id="g-x">Hapus target</button>':''}`);
 $('#g-t').oninput=fmtIn;
 $('#g-s').onclick=()=>{const n=$('#g-n').value.trim().toUpperCase(),t=parseInt($('#g-t').value.replace(/\D/g,''),10),ok=t>0&&t<=999999999999;setErr('gn',n?'':'Nama wajib diisi');setErr('gt',ok?'':'Masukkan target lebih dari 0');if(!n||!ok)return;
  const o={name:n,target:t,deadline:$('#g-d').value};if(id)save('Goals',goalRow(Object.assign(S.goals.find(x=>x.id===id),o)));else{const sc=$('#g-s2').value,g1={id:uid(),...o,scope:sc,owner:sc==='private'?ME:'',deps:[]};S.goals.push(g1);save('Goals',goalRow(g1))}closeSheet();render();toast('Target disimpan')};
 if(id)$('#g-x').onclick=()=>confirmBox(`Target ${esc(g.name)} beserta semua setorannya akan dihapus.`,()=>{S.goals=S.goals.filter(x=>x.id!==id);drop('Goals',id);render()})}
// ===== Events =====
document.addEventListener('click',e=>{
  if(e.target===ov&&!ov.classList.contains('dlg')){closeSheet();return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
  if(a==='tab'){tab=b.dataset.t;render();window.scrollTo(0,0)}
  else if(a==='logout')logout();else if(a==='reload'){load().then(r=>{if(r!==true&&/passcode/i.test(r))gate(r)})}else if(a==='add')txSheet();else if(a==='editTx')txSheet(id);else if(a==='close')closeSheet();else if(a==='settings')setSheet();else if(a==='themeToggle')setTheme(currentTheme()==='dark'?'light':'dark');
  else if(a==='ttype')ov.onclick2(v);
  else if(a==='ftype'){F.type=v;render()}
  else if(a==='freset'){F={type:'all',cat:'',acc:'',q:'',month:'',day:''};render()}
  else if(a==='del')confirmBox('Transaksi ini akan dihapus dari daftar.',()=>{S.transactions=S.transactions.filter(t=>t.id!==id);drop('Transactions',id);render();toast('Transaksi dihapus')});
  else if(a==='editAcc')accSheet(id);else if(a==='addDate')dateSheet();
  else if(a==='editGoal')goalSheet(id);else if(a==='addDep')depSheet(id);
  else if(a==='delDep')confirmBox('Setoran ini akan dihapus.',()=>{const g=S.goals.find(x=>x.id===id);g.deps=g.deps.filter(d=>d.id!==b.dataset.d);drop('Deposits',b.dataset.d);render()});
  else if(a==='delDate')confirmBox('Tanggal spesial ini akan dihapus.',()=>{S.dates=S.dates.filter(d=>d.id!==id);drop('Dates',id);render()});
  else if(a==='delCat'){if(S.transactions.some(t=>t.cat===id)){toast('Kategori masih dipakai transaksi');return}S.categories=S.categories.filter(c=>c.id!==id);drop('Categories',id);setSheet();render()}
  else if(a==='model'){setModel(v)}
  else if(a==='theme'){setTheme(v);ov.querySelectorAll('[data-act="theme"]').forEach(x=>x.classList.toggle('on',x.dataset.v===v))}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('tx-edit')){e.preventDefault();txSheet(e.target.dataset.id)}});
document.addEventListener('input',e=>{if(e.target.id==='fq'){F.q=e.target.value;listTx()}});
document.addEventListener('change',e=>{if(e.target.id==='fcat'){F.cat=e.target.value;listTx()}if(e.target.id==='facc'){F.acc=e.target.value;listTx()}if(e.target.id==='fmon'){F.month=e.target.value;listTx()}if(e.target.id==='fday'){F.day=e.target.value;listTx()}});
$('#gear').innerHTML=ic('gear',22);syncThemeButton();$('#fab').innerHTML=ic('plus',28);
render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&loaded&&!pend&&ov.classList.contains('hide'))load()});
(async()=>{if(CFG.key&&(inScript||CFG.url)){const r=await load();if(r!==true&&/passcode/i.test(r)){LS.del('olw_key');CFG.key='';gate(r)}}else gate()})();
</script></body></html>
