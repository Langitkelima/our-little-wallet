.kpf>.btn.gh{order:2}

/* ===== Tahap 6: filter periode, nav tengah, sembunyikan nominal ===== */
html[data-model] .ib.on{border-color:var(--accent-strong);color:var(--accent-strong);background:var(--accent-soft)}
.pbar{display:flex;gap:10px;align-items:center;margin:0 0 14px;position:relative}
.pdd{flex:none;display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.pdd.open{border-color:var(--accent-strong);color:var(--accent-strong)}
.pnav{flex:1;min-width:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 4px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.pnav button{flex:none;width:40px;height:40px;border:0;background:none;color:var(--mut);display:grid;place-items:center;cursor:pointer;border-radius:12px}
.pnav button:disabled{opacity:.3;cursor:default}
.plab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px;font-weight:700;border-bottom:1.5px dotted var(--mut);padding-bottom:1px;cursor:pointer}
.pbd{position:fixed;inset:0;z-index:44;background:transparent}
.pmenu{position:absolute;top:56px;left:0;z-index:45;min-width:236px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px;box-shadow:var(--sh)}
.pi{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 14px;border-radius:14px;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer}
.pi.on{background:var(--accent-soft);color:var(--accent-strong)}
.ppin{display:grid;place-items:center;width:34px;height:34px;margin:-6px -6px -6px 0;color:var(--mut);border-radius:10px}
.ppin.on{color:var(--accent-strong)}.ppin.on svg{fill:currentColor}
.nbub{display:inline-grid;width:28px;height:28px;place-items:center}

.nbub::after{display:none}
.chatb:active .nbub{transform:scale(.94)}

.pmenu{min-width:260px;max-width:calc(100vw - 32px)}

.psearch:focus-within{border-color:var(--accent-strong)}

.pmenu{min-width:0;width:min(300px,calc(100vw - 32px));max-height:calc(100vh - 230px);overflow-y:auto}
.pi{padding:11px 14px;font-size:15.5px}
.ppin{width:30px;height:30px;margin:-5px -4px -5px 0}
.pf{display:flex;align-items:center;gap:10px;padding:4px 6px;font-size:13px;font-weight:700;color:var(--mut)}
.pf span{flex:none;width:56px}
html[data-model] .pmenu .pf select,html[data-model] .pmenu .pf select:focus{flex:1;min-width:0;width:auto;height:42px;min-height:0;margin:0;padding:0 12px;font-size:14px;border-radius:12px;outline:0;box-shadow:none}
html[data-model] .pmenu .pf select:focus{border-color:var(--accent-strong)}
.psep{margin:6px 6px 8px}

html[data-model] .pmenu .pf{display:flex;align-items:center;gap:10px;margin:0;padding:4px 6px;font-size:13px;font-weight:700;color:var(--mut)}
html[data-model] .pmenu .pf span{flex:none;width:62px}
html[data-model] .pmenu .pi{padding:9px 14px}

.plab{text-transform:uppercase;letter-spacing:.04em;font-size:14px}
.myr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}

.myr .ib:disabled{opacity:.3}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

html[data-model] .mpk.on{background:var(--btn);color:#fff;border-color:transparent}
html[data-model] .mpk:disabled{opacity:.3;cursor:default}

/* Logo resmi (tertanam di file ini, 144px). Brand tanpa gambar (mis. SUPERBANK) memakai logo gambaran. */
Object.keys(LOGO_IMG).forEach(k=>{if(BRANDS1[k])BRANDS1[k].img=LOGO_IMG[k]});
const brandOf1=name=>{const u=String(name||'').toUpperCase();const r=BRAND_RULES1.find(x=>x[1].test(u));return r?BRANDS1[r[0]]:null};
function logo1(name,size=40,cls=''){const b=typeof name==='object'?name:brandOf1(name);if(!b)return'';
  if(b.img)return `<img class="${cls}" src="${b.img}" width="${size}" height="${size}" alt="${esc(b.n)}" style="border-radius:28%;flex:none;object-fit:cover;display:block">`;
  const H=b.strip?33:48,L=b.t,mx=Math.max(...L.map(s=>s.length));
  const fs=Math.min(L.length>1?15:20,40/(.6*mx),(H-8)/L.length);
  const ty=L.length>1?H/2-fs*.1:H/2+fs*.34;
  const txt=L.map((s,i)=>`<text x="24" y="${(L.length>1?(H/2-(L.length-1)*fs*.55+i*fs*1.1+fs*.34):ty).toFixed(1)}" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="${fs.toFixed(1)}" fill="${b.fg}">${esc(s)}</text>`).join('');
  const st=b.strip?`<rect y="33" width="48" height="15" fill="${b.strip.bg}"/><text x="24" y="43.6" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="10" fill="${b.strip.fg}">${esc(b.strip.t)}</text>`:'';
  return `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 48 48" role="img" aria-label="${esc(b.n)}" style="border-radius:28%;flex:none"><rect width="48" height="${H}" fill="${b.bg}"/>${txt}${st}</svg>`}
const miniLogo1=name=>{const b=brandOf1(name);return b?`<span class="mlogo">${logo1(b,20)}</span>`:''};
const accAv1=name=>{const b=brandOf1(name);if(b)return`<div class="av avlogo">${logo1(b,42)}</div>`;
  const cash=/TUNAI|CASH/i.test(name||'');return`<div class="av" style="background:var(--pink)">${ic(cash?'cash':'wallet',20)}</div>`};

  if(inScript)google.script.run.withSuccessHandler(done).withFailureHandler(e=>rej(new Error(e.message||'Gagal terhubung'))).api(p);
  else fetch(CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:p}).then(r=>r.text()).then(done,()=>rej(new Error('Tidak bisa terhubung ke server')))})}

  const pinPart=`<div class="pin-dots" id="pd" aria-label="Passcode"></div><div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" class="key" data-k="${n}" aria-label="${n}">${n}</button>`).join('')}<span class="sp"></span><button type="button" class="key" data-k="0" aria-label="0">0</button><button type="button" class="key ghost" data-k="bs" aria-label="Hapus satu angka">${ic('back',24)}</button></div>`;
  const kbPart=`<label for="g-k">Passcode</label><input id="g-k" type="password" autocomplete="current-password">`;
  ov.innerHTML=`<div class="sheet gate"><div class="gate-top"><button type="button" class="gate-logo" data-act="themeToggle" aria-label="Ganti tema" title="Ganti tema (terang/gelap)">${ic('heart',22)}</button><img class="gate-brand" src="${(document.querySelector('.brand-logo img')||{}).src||''}" alt="Two Pockets"></div><div class="gate-eyebrow">RUANG PRIBADI KITA</div><h3>Masuk ♡</h3><p class="sub">Masukkan passcode pribadi kamu. RAMA dan DESY punya passcode berbeda, dan data pribadi masing-masing tidak terlihat oleh yang lain di aplikasi.</p>${needUrl?`<label for="g-u">URL Web App</label><input id="g-u" placeholder="Tempel URL Web App (berakhiran /exec)" value="${esc(CFG.url)}">`:''}${gateKb?kbPart:pinPart}<label style="font-weight:400"><input type="checkbox" id="g-r" ${gateRem?'checked':''} style="width:auto;min-height:0;margin-right:8px">Ingat di perangkat ini</label><div class="err" id="e-gk">${esc(msg||'')}</div><button class="btn" id="g-go">Masuk</button><button type="button" class="link gate-sw" id="g-sw">${gateKb?'Pakai keypad angka':'Passcode bukan angka? Pakai keyboard'}</button></div>`;
  const drawDots=()=>{const el=$('#pd');if(!el)return;const n=Math.max(4,pin.length);let h='';for(let i=0;i < n;i++)h+=`<span class="pin-dot${i < pin.length?' on':''}"></span>`;el.innerHTML=h};
  if(!gateKb)drawDots();
  ov.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(busy)return;const k=b.dataset.k;if(k==='bs')pin=pin.slice(0,-1);else if(pin.length < 32)pin+=k;setErr('gk','');drawDots()});
  $('#g-r').onchange=e=>{gateRem=e.target.checked};
  $('#g-sw').onclick=()=>{gateKb=!gateKb;gate();if(gateKb){const i=$('#g-k');if(i)i.focus()}};
  const go=async()=>{if(busy)return;const key=gateKb?$('#g-k').value:pin;
    if($('#g-u'))CFG.url=$('#g-u').value.trim();
    if(!key){setErr('gk','Passcode wajib diisi');return}
    CFG.key=key;busy=true;setErr('gk','Memeriksa…');
    const r=await load();busy=false;
    if(r===true){if(gateRem){LS.set('olw_key',CFG.key);if(CFG.url)LS.set('olw_url',CFG.url)}closeSheet()}
    else{setErr('gk',r);if(!gateKb){pin='';drawDots()}else{const i=$('#g-k');if(i){i.value='';i.focus()}}}};
  $('#g-go').onclick=go;
  if(gateKb)$('#g-k').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
}

const botLogo=()=>`<img class="botlogo" src="${BOT_LOGO}" alt="">`;
const chatAv=()=>`<div class="cav">${botLogo()}</div>`;
const cFoot=(m,i)=>m.st==='new'?`<div class="cact"><button type="button" class="cb pri" data-act="cSave" data-i="${i}">Simpan</button><button type="button" class="cb" data-act="cEdit" data-i="${i}">Edit</button><button type="button" class="cb gh" data-act="cDel" data-i="${i}">Batal</button></div>`:m.st==='saved'?'<div class="cst ok">✓ Tersimpan</div>':'<div class="cst">Dibatalkan</div>';
function trfCard(m,i){const f=acct(m.from),t=acct(m.to);
  return `<div class="ccard trf ${m.st}"><div class="ct"><span class="cn">TRANSFER</span><span class="ca">${rpRaw(m.amount)}</span></div><div class="cm"><span class="cpill">Transfer</span><span>${fdate(m.date)}</span><span>${esc(f.name)} → ${esc(t.name)}</span></div>${cFoot(m,i)}</div>`}
function aCard(m,i){
  const foot=m.st==='new'?`<div class="cact"><button type="button" class="cb pri" data-act="cAccSave" data-i="${i}">Simpan akun</button><button type="button" class="cb gh" data-act="cAccNo" data-i="${i}">Batal</button></div>`:m.st==='saved'?'<div class="cst ok">✓ Akun tersimpan</div>':'<div class="cst">Dibatalkan</div>';
  return `<div class="ccard trf ${m.st}"><div class="ct"><span class="cn">${esc(m.name)}</span><span class="ca">${rpRaw(m.opening)}</span></div><div class="cm"><span class="cpill">Akun baru</span><span>Saldo awal</span></div>${foot}</div>`}
function dCard(m,i){const t=m.tx,c=cat(t.cat),a=acct(t.acc),inn=t.type==='in',isT=String(t.note||'').indexOf('TRF:')===0;
  const foot=m.st==='new'?`<div class="cact"><button type="button" class="cb dng" data-act="cDx" data-i="${i}">Hapus</button><button type="button" class="cb gh" data-act="cDxNo" data-i="${i}">Batal</button></div>`:m.st==='done'?'<div class="cst ok">✓ Dihapus</div>':'<div class="cst">Dibatalkan</div>';
  return `<div class="ccard dx ${inn?'in':'out'} ${m.st}"><div class="ct"><span class="cn">${esc(t.desc)}</span><span class="ca">${inn?'+':'−'}${rpRaw(t.amount)}</span></div><div class="cm"><span class="cpill dp">Hapus transaksi</span><span>${fdate(t.date)}</span><span class="ccat">${catIc(c,16)}${esc(c.name)}</span><span>${esc(a.name)}</span></div>${isT?'<div class="cnote">Ini bagian dari transfer, kedua sisinya ikut dihapus.</div>':''}${foot}</div>`}
function chatCard(m,i){if(m.type==='trf')return trfCard(m,i);const c=cat(m.cat),a=acct(m.acc),inn=m.type==='in';
  const foot=m.st==='new'?`<div class="cact"><button type="button" class="cb pri" data-act="cSave" data-i="${i}">Simpan</button><button type="button" class="cb" data-act="cEdit" data-i="${i}">Edit</button><button type="button" class="cb gh" data-act="cDel" data-i="${i}">Batal</button></div>`:m.st==='saved'?'<div class="cst ok">✓ Tersimpan</div>':'<div class="cst">Dibatalkan</div>';
  return `<div class="ccard ${inn?'in':'out'} ${m.st}"><div class="ct"><span class="cn">${esc(m.desc)}</span><span class="ca">${inn?'+':'−'}${rpRaw(m.amount)}</span></div><div class="cm"><span class="cpill">${inn?'Pemasukan':'Pengeluaran'}</span><span>${fdate(m.date)}</span><span class="ccat">${catIc(c,16)}${esc(c.name)}</span><span>${esc(a.name)}</span></div>${foot}</div>`}
function chatHtml(){
  let h=`<div class="cmsg bot">${chatAv()}<div class="cbub">${esc(CHAT_HELLO)}</div></div>`;
  CHAT.forEach((m,i)=>{
    if(m.k==='me')h+=`<div class="cmsg me"><div class="cbub">${esc(m.text)}</div></div>`;
    else if(m.k==='bot')h+=`<div class="cmsg bot">${chatAv()}<div class="cbub${m.err?' err':''}">${esc(m.text)}</div></div>`;
    else if(m.k==='typing')h+=`<div class="cmsg bot">${chatAv()}<div class="cbub typing">Sebentar, aku baca dulu…</div></div>`;
    else if(m.k==='card')h+=chatCard(m,i);
    else if(m.k==='dcard')h+=dCard(m,i);
    else if(m.k==='acard')h+=aCard(m,i);
    else if(m.k==='all'){const n=CHAT.filter(x=>x.k==='card'&&x.g===m.g&&x.st==='new').length;if(n>1)h+=`<div class="callrow"><button type="button" class="cb pri" data-act="cAll" data-g="${m.g}">Simpan semua (${n})</button></div>`}
  });
  return h}
function chatView(){return `<div class="chatlog" id="chatLog">${chatHtml()}</div>`}
function chatDraw(){const el=$('#chatLog');if(!el)return;el.innerHTML=chatHtml();const b=$('#chatBtn');if(b)b.disabled=chatBusy;
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function chatSync(){const has=$('#chatbar');
  if(tab!=='chat'||!loaded){if(has)has.remove();return}
  if(has){chatDraw();return}
  const d=document.createElement('div');d.id='chatbar';d.className='chatbar';
  d.innerHTML=`<div class="chatbar-in"><div class="cchips">${['Makan bakso 15rb','Bensin 50000','Gaji bulanan 8jt'].map(t=>`<button type="button" class="cchip" data-act="cChip" data-v="${esc(t)}">${esc(t)}</button>`).join('')+`<button type="button" class="cchip" data-act="cTrf">⇄ Transfer</button>`}</div><div class="cform"><input id="chatIn" type="text" maxlength="300" autocomplete="off" enterkeyhint="send" placeholder="Ketik transaksi, mis. makan bakso 15rb"><button type="button" class="csend" id="chatBtn" data-act="cSend" aria-label="Kirim">${ic('send',20)}</button></div></div>`;
  document.body.appendChild(d);chatDraw()}
const chatOk=it=>it&&S.categories.some(c=>c.id===it.cat)&&S.accounts.some(a=>a.id===it.acc)&&Number(it.amount)>0&&/^\d{4}-\d{2}-\d{2}$/.test(String(it.date||''));
async function chatSend(){
  if(chatBusy)return;const inp=$('#chatIn');if(!inp)return;const text=inp.value.trim();if(!text)return;
  const history=CHAT.filter(m=>m.k==='me'||(m.k==='bot'&&!m.err)).slice(-6).map(m=>({r:m.k==='me'?'me':'bot',t:m.text}));
  inp.value='';chatBusy=true;CHAT.push({k:'me',text});CHAT.push({k:'typing'});chatDraw();
  try{
    const r=await call({action:'parseChat',text,history});
    CHAT=CHAT.filter(m=>m.k!=='typing');
    const res=r.result||{},items=(res.items||[]).filter(chatOk),g='g'+Date.now();
    const hasAcc=id=>S.accounts.some(a=>a.id===id);
    const trfs=(res.transfers||[]).filter(t=>t&&hasAcc(t.from)&&hasAcc(t.to)&&t.from!==t.to&&Number(t.amount)>0&&/^\d{4}-\d{2}-\d{2}$/.test(String(t.date||'')));
    const dels=(res.deletes||[]).filter(t=>t&&S.transactions.some(x=>x.id===t.id));
    const accs=(res.accounts||[]).filter(a=>a&&String(a.name||'').trim()&&!S.accounts.some(x=>String(x.name).trim().toUpperCase()===String(a.name).trim().toUpperCase()));
    if(res.reply)CHAT.push({k:'bot',text:res.reply});
    accs.forEach(a=>CHAT.push({k:'acard',st:'new',name:String(a.name).trim().toUpperCase().slice(0,30),opening:Math.max(0,Math.round(Number(a.opening)||0))}));
    items.forEach(it=>CHAT.push({k:'card',st:'new',g,date:it.date,type:it.type,cat:it.cat,desc:it.desc,amount:Math.round(Number(it.amount)),acc:it.acc}));
    trfs.forEach(t=>CHAT.push({k:'card',st:'new',g,type:'trf',from:t.from,to:t.to,amount:Math.round(Number(t.amount)),date:t.date}));
    dels.forEach(t=>CHAT.push({k:'dcard',st:'new',tx:{id:t.id,date:t.date,type:t.type,amount:t.amount,desc:t.desc,acc:t.acc,cat:t.cat,note:t.note||''}}));
    if(items.length+trfs.length>1)CHAT.push({k:'all',g});
    if(!res.reply&&!items.length&&!trfs.length&&!dels.length&&!accs.length)CHAT.push({k:'bot',text:'Aku belum nangkap transaksinya. Coba tulis seperti "Makan bakso 15rb".'});
  }catch(e){
    CHAT=CHAT.filter(m=>m.k!=='typing');CHAT.push({k:'bot',err:1,text:'Gagal: '+e.message});
    if(/passcode/i.test(e.message))resync(e.message);
  }
  chatBusy=false;chatDraw();const i2=$('#chatIn');if(i2)i2.focus()}

// ===== Keypad kalkulator (angka + / x - +) =====
const KP_OPS={'+':'+','-':'\u2212','*':'\u00D7','/':'\u00F7'};
function kpEval(e){e=String(e).replace(/[+\-*/]+$/,'');if(!e)return 0;const t=e.match(/\d+|[+\-*/]/g);const n=[+t[0]],o=[];
  for(let i=1;i < t.length;i+=2){const op=t[i],v=+t[i+1];if(op==='*'){n.push(n.pop()*v)}else if(op==='/'){const a=n.pop();n.push(v===0?NaN:a/v)}else{o.push(op);n.push(v)}}
  let r=n[0];o.forEach((op,i)=>{r=op==='+'?r+n[i+1]:r-n[i+1]});return isFinite(r)?Math.round(r):NaN}
const kpHtml=id=>`<div class="kp" id="${id}"><div class="kpd"><div class="kpx" id="${id}-x"></div><div class="kpn"><span>Rp</span><b id="${id}-v">0</b></div></div><div class="kpk">${['7','8','9','4','5','6','1','2','3','000','0','bs'].map(k=>`<button type="button" class="kk ${KP_OPS[k]?'op':k==='bs'?'bs':''}" data-kp="${k}" aria-label="${k==='bs'?'Hapus angka':KP_OPS[k]||k}">${k==='bs'?'\u232B':KP_OPS[k]||k}</button>`).join('')}</div></div>`;
function kpInit(id,init){let e=init>0?String(Math.round(init)):'';
  const draw=()=>{const sh=e.replace(/\d+/g,m=>(+m).toLocaleString('id-ID')).replace(/[+\-*/]/g,m=>' '+KP_OPS[m]+' ');
    $('#'+id+'-x').textContent=/[+\-*/]/.test(e)?sh:'';const v=kpEval(e);$('#'+id+'-v').textContent=(v>0?v:0).toLocaleString('id-ID')};
  document.querySelectorAll('#'+id+' [data-kp]').forEach(b=>{const k=b.dataset.kp;let tm=0,cleared=false;
    if(k==='bs'){b.addEventListener('pointerdown',()=>{cleared=false;tm=setTimeout(()=>{e='';cleared=true;draw()},600)});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(tm)))}
    b.addEventListener('click',()=>{if(cleared){cleared=false;return}
      if(k==='bs')e=e.slice(0,-1);
      else if(KP_OPS[k]){if(!e)return;e=/[+\-*/]$/.test(e)?e.slice(0,-1)+k:e+k}
      else{const cur=(e.match(/\d+$/)||[''])[0];if(k==='000'&&(cur===''||cur==='0'))return;if(cur.length+k.length>12)return;if(cur==='0')e=e.slice(0,-1);e+=k}
      try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}
      draw()})});
  draw();return{get:()=>kpEval(e)}}

    saveNew('Dates',S.dates,{id:uid(),title:t,date:d,yearly:$('#x-y').checked,note:$('#x-n').value.trim()});closeSheet();render()}}

function depSheet(gid){const g=S.goals.find(x=>x.id===gid);
 sheet('Setor tabungan',`<p class="sub">${esc(g.name)}</p><label for="s-date">Tanggal</label><input type="date" id="s-date" value="${isoL(NOW)}"><div class="err" id="e-sd"></div><label for="s-amt">Nominal (Rp)</label><input id="s-amt" inputmode="numeric" placeholder="0" autocomplete="off"><div class="err" id="e-sa"></div><label for="s-note">Catatan (opsional)</label><input id="s-note" maxlength="60"><button class="btn" id="s-save">Simpan setoran</button>`);

function goalSheet(id){const g=S.goals.find(x=>x.id===id)||{name:'',target:0,deadline:''};
 sheet(id?'Ubah target':'Target tabungan baru',`<label for="g-n">Nama target</label><input id="g-n" maxlength="40" autocapitalize="characters" style="text-transform:uppercase" value="${esc(g.name)}" placeholder="mis. Tabungan Nikah"><div class="err" id="e-gn"></div><label for="g-t">Target dana (Rp)</label><input id="g-t" inputmode="numeric" value="${g.target?g.target.toLocaleString('id-ID'):''}" placeholder="0"><div class="err" id="e-gt"></div>${id?'':'<label for="g-s2">Jenis tabungan</label><select id="g-s2"><option value="shared">Bersama (RAMA dan DESY bisa lihat)</option><option value="private">Pribadi (hanya aku)</option></select>'}<label for="g-d">Target tanggal (opsional)</label><input type="date" id="g-d" value="${g.deadline}"><button class="btn" id="g-s">Simpan</button>${id?'<button class="btn sec" id="g-x">Hapus target</button>':''}`);
 $('#g-t').oninput=fmtIn;
 $('#g-s').onclick=()=>{const n=$('#g-n').value.trim().toUpperCase(),t=parseInt($('#g-t').value.replace(/\D/g,''),10),ok=t>0&&t<=999999999999;setErr('gn',n?'':'Nama wajib diisi');setErr('gt',ok?'':'Masukkan target lebih dari 0');if(!n||!ok)return;
  const o={name:n,target:t,deadline:$('#g-d').value};if(id)save('Goals',goalRow(Object.assign(S.goals.find(x=>x.id===id),o)));else{const sc=$('#g-s2').value,g1={id:uid(),...o,scope:sc,owner:sc==='private'?ME:'',deps:[]};S.goals.push(g1);save('Goals',goalRow(g1))}closeSheet();render();toast('Target disimpan')};
 if(id)$('#g-x').onclick=()=>confirmBox(`Target ${esc(g.name)} beserta semua setorannya akan dihapus.`,()=>{S.goals=S.goals.filter(x=>x.id!==id);drop('Goals',id);render()})}

  else if(a==='ftype'){F.type=v;render()}

  else if(a==='del')confirmBox('Transaksi ini akan dihapus dari daftar.',()=>{S.transactions=S.transactions.filter(t=>t.id!==id);drop('Transactions',id);render();toast('Transaksi dihapus')});
  else if(a==='editAcc')accSheet(id);else if(a==='addDate')dateSheet();
  else if(a==='editGoal')goalSheet(id);else if(a==='addDep')depSheet(id);
  else if(a==='delDep')confirmBox('Setoran ini akan dihapus.',()=>{const g=S.goals.find(x=>x.id===id);g.deps=g.deps.filter(d=>d.id!==b.dataset.d);drop('Deposits',b.dataset.d);render()});
  else if(a==='delDate')confirmBox('Tanggal spesial ini akan dihapus.',()=>{S.dates=S.dates.filter(d=>d.id!==id);drop('Dates',id);render()});
  else if(a==='delCat'){if(S.transactions.some(t=>t.cat===id)){toast('Kategori masih dipakai transaksi');return}S.categories=S.categories.filter(c=>c.id!==id);drop('Categories',id);setSheet();render()}
  else if(a==='cSend')chatSend();
  else if(a==='cChip'){const i=$('#chatIn');if(i){i.value=v;i.focus()}}
  else if(a==='cSave')chatSave(+b.dataset.i);

  else if(a==='cAccNo')chatAccNo(+b.dataset.i);
  else if(a==='cEdit')chatEdit(+b.dataset.i);
  else if(a==='cDel')chatDel(+b.dataset.i);
  else if(a==='cAll')chatSaveAll(b.dataset.g);
  else if(a==='cTrf'||a==='trfgo')trfSheet();

  else if(a==='theme'){setTheme(v);ov.querySelectorAll('[data-act="theme"]').forEach(x=>x.classList.toggle('on',x.dataset.v===v))}
});

/* Keyboard HP: naikkan bar chat di atas keyboard supaya ketikan kelihatan */
(function(){const vv=window.visualViewport;let last=-1;
  function kbSync(){
    const lay=Math.max(window.innerHeight||0,document.documentElement.clientHeight||0);
    const vh=vv?vv.height+vv.offsetTop:lay;
    let kb=Math.max(0,Math.round(lay-vh));
    const a=document.activeElement,typing=a&&a.id==='chatIn';
    if(kb<80)kb=0;
    document.documentElement.style.setProperty('--kb',kb+'px');
    document.body.classList.toggle('kb',kb>0&&tab==='chat'&&!!typing);
    if(kb!==last){last=kb;if(kb>0&&typing)setTimeout(()=>window.scrollTo({top:document.body.scrollHeight}),60)}
  }
  if(vv){vv.addEventListener('resize',kbSync);vv.addEventListener('scroll',kbSync)}
  window.addEventListener('resize',kbSync);
  document.addEventListener('focusin',e=>{if(e.target&&e.target.id==='chatIn'){kbSync();setTimeout(kbSync,150);setTimeout(kbSync,400)}});
  document.addEventListener('focusout',e=>{if(e.target&&e.target.id==='chatIn')setTimeout(kbSync,100)});
})();
